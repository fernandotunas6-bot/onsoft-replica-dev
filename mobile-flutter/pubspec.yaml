name: siga_plus_flutter
description: SIGA Plus mobile institutional Flutter client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  file_picker: 11.0.3
  fluentui_system_icons: 1.1.273
  flutter:
    sdk: flutter
  go_router: 16.2.4
  http: 1.5.0
  shared_preferences: 2.5.3
  supabase_flutter: 2.10.0
  url_launcher: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  # Inter (SIL Open Font License, assets/fonts/LICENSE-Inter.txt): a
  # tipografia das referências visuais, incluída para não depender da rede.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
