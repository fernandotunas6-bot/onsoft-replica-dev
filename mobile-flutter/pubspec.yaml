name: siga_plus_flutter
description: SIGA Plus mobile institutional Flutter client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  go_router: 16.2.4
  http: 1.5.0
  shared_preferences: 2.5.3
  supabase_flutter: 2.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Latin.ttf
