name: Teacher profile 360 one-time formatter
on:
  push:
    branches:
      - feat/teacher-profile-360-context-20261029
    paths:
      - .github/workflows/teacher-profile-360-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply project Prettier to changed TS/TSX excluding generated database types
        shell: bash
        run: |
          mapfile -d '' -t all < <(git diff -z --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          files=()
          for f in "${all[@]}"; do
            case "$f" in src/integrations/supabase/types.sga.ts) continue ;; esac
            files+=("$f")
          done
          if (( ${#files[@]} )); then
            bunx prettier --write "${files[@]}"
            git add -- "${files[@]}"
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'siga-pr-formatter'
            git config user.email 'siga-pr-formatter@users.noreply.github.com'
            git commit -m 'style(teacher-docs): apply project formatting [skip ci]'
            git push origin HEAD:feat/teacher-profile-360-context-20261029
          fi
