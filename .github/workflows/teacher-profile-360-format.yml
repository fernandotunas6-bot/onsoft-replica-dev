name: Teacher profile 360 formatter (temporary)
on:
  push:
    branches:
      - feat/teacher-profile-360-context-20261029
    paths:
      - .github/workflows/teacher-profile-360-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format changed TypeScript and React source
        shell: bash
        run: |
          mapfile -d '' -t files < <(git diff -z --name-only origin/main...HEAD -- '*.ts' '*.tsx')
          if (( ${#files[@]} )); then
            bunx prettier --write "${files[@]}"
            git add -- "${files[@]}"
          fi
          if ! git diff --cached --quiet; then
            git config user.name 'siga-ci-formatter'
            git config user.email 'siga-ci-formatter@users.noreply.github.com'
            git commit -m 'style(teacher): format changed files [skip ci]'
            git push origin HEAD:feat/teacher-profile-360-context-20261029
          fi
