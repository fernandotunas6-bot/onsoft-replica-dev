name: CRUD Phase 3 formatting (one-shot)
on:
  push:
    branches:
      - feat/crud-premium-engineering-20261028
    paths:
      - .github/workflows/crud-phase3-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crud-premium-engineering-20261028
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format only Phase 3 edited files
        run: |
          bunx prettier --write \
            src/components/modals/QuickFormModal.tsx \
            src/components/forms/AngolaIdentityField.tsx \
            src/features/people/quick-form-validation.ts \
            src/features/people/schemas.ts \
            src/features/people/server.ts \
            src/routes/pessoas/index.tsx \
            tests/people/quick-form-validation.test.ts \
            tests/ui/quick-form-validation.test.tsx \
            tests/people/schemas.test.ts
      - name: Commit only formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modals/QuickFormModal.tsx src/components/forms/AngolaIdentityField.tsx src/features/people/quick-form-validation.ts src/features/people/schemas.ts src/features/people/server.ts src/routes/pessoas/index.tsx tests/people/quick-form-validation.test.ts tests/ui/quick-form-validation.test.tsx tests/people/schemas.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(crud): format phase three forms and tests"
            git push origin HEAD:feat/crud-premium-engineering-20261028
          fi
