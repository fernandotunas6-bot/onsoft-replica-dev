name: Google Workspace Check

on:
  pull_request:
    paths:
      - 'src/integrations/google/**'
      - 'src/features/school/GoogleWorkspaceConnectCard.tsx'
      - 'src/components/auth/AuthGate.tsx'
      - 'src/features/auth/**'
      - 'tests/integrations/google-workspace-*.test.ts'
      - 'tests/security/google-email-auth-contracts.test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/google-workspace-check.yml'
  push:
    branches: [main]
    paths:
      - 'src/integrations/google/**'
      - 'src/features/school/GoogleWorkspaceConnectCard.tsx'
      - 'src/components/auth/AuthGate.tsx'
      - 'src/features/auth/**'
      - 'tests/integrations/google-workspace-*.test.ts'
      - 'tests/security/google-email-auth-contracts.test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/google-workspace-check.yml'

permissions:
  contents: read

jobs:
  google-workspace:
    name: OAuth / Google APIs / Email regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Google OAuth and email regression
        run: bun run test:google:oauth

      - name: Mocked Google mass operations
        run: bun run test:google:mass

      - name: Lint Google and authentication paths
        run: >-
          bunx eslint
          src/integrations/google
          src/features/school/GoogleWorkspaceConnectCard.tsx
          src/components/auth/AuthGate.tsx
          src/features/auth
          tests/integrations/google-workspace-api.test.ts
          tests/integrations/google-workspace-oauth.test.ts
          tests/integrations/google-workspace-security.test.ts
          tests/integrations/google-workspace-rate-limit.test.ts
          tests/security/google-email-auth-contracts.test.ts

      - name: Production build
        run: bun run build
