name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Scan de segurança semanal (segundas, 04:00 UTC)
    - cron: "0 4 * * 1"

jobs:
  security:
    name: Auditoria de dependências (falha em alta/crítica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Auditoria de segurança
        run: |
          mkdir -p reports/security
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee reports/security/dependency-audit.txt

      - name: Publicar relatório de segurança
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            reports/security
            docs/SECURITY.md

  quality:
    name: Estilo, acessibilidade e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Checklist de estilo (IconChip / MediaFrame / paleta)
        env:
          STYLE_CHECK_CHANGED_FROM: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bun run check:style

      - name: Verificação de acessibilidade (contraste, foco, labels)
        run: bun run check:a11y:report

      - name: Publicar relatório HTML de acessibilidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: reports/a11y.html

      - name: Lint
        run: bun run lint

      - name: Testes (Vitest)
        run: bun run test

      - name: Inventário SIGA (módulos e infra de navegação)
        run: node scripts/siga/check-modules.mjs

      - name: Build
        run: bun run build

  coverage:
    name: Cobertura IconChip / MediaFrame por rota
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          bun install --frozen-lockfile
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Arrancar servidor de desenvolvimento
        run: |
          bun run dev &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3006/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "SIGA dev server did not become ready on port 3006"
            exit 1
          fi

      - name: Resumo de cobertura de estilo por rota
        run: BASE_URL=http://localhost:3006 python scripts/style-coverage.py

      - name: Navegação apenas por teclado (skip link, foco, aria-current)
        run: BASE_URL=http://localhost:3006 python scripts/keyboard-nav.py

      - name: Acessibilidade da sidebar e IconChip (contraste, foco, tabulação, ARIA)
        run: BASE_URL=http://localhost:3006 python scripts/a11y-sidebar.py

  lighthouse:
    name: Lighthouse CI (FCP / LCP / INP)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Arrancar servidor de desenvolvimento
        run: |
          bun run dev &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3006/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "SIGA dev server did not become ready on port 3006"
            exit 1
          fi

      - name: Correr Lighthouse CI
        run: bunx --bun @lhci/cli@0.14.x autorun --config=lighthouserc.json

      - name: Publicar relatórios Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: reports/lighthouse

  visual:
    name: Regressão visual (Minimals)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          bun install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Arrancar servidor de desenvolvimento
        run: |
          bun run dev &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3006/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "SIGA dev server did not become ready on port 3006"
            exit 1
          fi

      - name: Comparar screenshots com as baselines
        run: BASE_URL=http://localhost:3006 python scripts/visual-regression.py

      - name: Comparar sidebar e drawer (multi-viewport)
        run: BASE_URL=http://localhost:3006 python scripts/visual-sidebar.py

      - name: Publicar diferenças
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            tests/visual/current
            tests/visual/diff
            tests/visual-sidebar/current
            tests/visual-sidebar/diff

  ecosystem-e2e:
    name: Ecossistema — smoke E2E (Fase 13)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências (raiz + painéis)
        run: |
          bun install --frozen-lockfile
          npm ci --prefix painel/web
          npm ci --prefix painel/admin
          npm ci --prefix painel/docs
          python -m pip install --requirement requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Configurar Supabase para E2E @live (opcional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/siga/prepare-ci-env.mjs

      - name: Arrancar ecossistema (4 apps)
        run: node scripts/siga/start-ecosystem-ci.mjs

      - name: Aguardar portas do ecossistema
        run: node scripts/siga/wait-ecosystem.mjs
        env:
          SIGA_E2E_WAIT_ATTEMPTS: "120"

      - name: Smoke HTTP do ecossistema
        run: SIGA_E2E_CI=1 bun run siga:e2e-smoke

      - name: Instalar browsers Playwright (TypeScript)
        run: npx playwright install --with-deps chromium

      - name: Playwright TS — rotas e wizard (sem provisionamento)
        run: bun run siga:e2e-playwright-ts

      - name: Playwright UI Python (rotas + wizard; @live se secret)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            SIGA_E2E_LIVE=1 python3 scripts/siga/e2e-ecosystem-playwright.py
          else
            python3 scripts/siga/e2e-ecosystem-playwright.py
          fi

      - name: Playwright TS @live (comercial + matrícula, opcional)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SIGA_E2E_LIVE: "1"
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Skip Playwright TS @live — SUPABASE_SECRET_KEY em falta."
            exit 0
          fi
          bun run siga:e2e-playwright-live

      - name: Cleanup tenants E2E órfãos (best-effort)
        if: always()
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then exit 0; fi
          node scripts/siga/e2e-cleanup-stale.mjs || true

      - name: Publicar relatório Playwright (falhas E2E)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Parar ecossistema
        if: always()
        run: node scripts/siga/stop-ecosystem-ci.mjs

  ecosystem-e2e-notify:
    name: Ecossistema E2E — alerta (Slack / e-mail)
    needs: ecosystem-e2e
    if: failure() && needs.ecosystem-e2e.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Notificar falha E2E
        env:
          SLACK_E2E_WEBHOOK_URL: ${{ secrets.SLACK_E2E_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          E2E_ALERT_EMAIL_TO: ${{ secrets.E2E_ALERT_EMAIL_TO }}
          E2E_ALERT_EMAIL_FROM: ${{ secrets.E2E_ALERT_EMAIL_FROM }}
          NOTIFY_TITLE: "Ecossistema E2E (PR/push) falhou"
          NOTIFY_CONTEXT: "Smoke, Playwright TS/Python e @live opcional."
        run: node scripts/siga/notify-ci-failure.mjs
