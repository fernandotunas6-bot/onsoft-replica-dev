name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Estilo, acessibilidade e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Checklist de estilo (IconChip / MediaFrame / paleta)
        run: bun run check:style

      - name: Verificação de acessibilidade (contraste, foco, labels)
        run: bun run check:a11y

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  visual:
    name: Regressão visual (Minimals)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          bun install --frozen-lockfile
          python -m pip install --upgrade pip
          pip install playwright pillow numpy
          python -m playwright install --with-deps chromium

      - name: Arrancar servidor de desenvolvimento
        run: |
          bun run dev &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 2; done

      - name: Comparar screenshots com as baselines
        run: python scripts/visual-regression.py

      - name: Publicar diferenças
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            tests/visual/current
            tests/visual/diff
