name: Finance PR formatting (one-time)

on:
  pull_request:
    paths:
      - ".github/workflows/finance-one-time-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 424 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format only PR financial files
        run: |
          bunx prettier --write \
            src/features/documents/print-overlays.ts \
            src/features/finance/components/ReceiptRegisterPanel.tsx \
            src/features/finance/components/StudentLedgerPanel.tsx \
            src/features/finance/receipt-register-excel.ts \
            src/features/finance/receipt-register-filter.ts \
            src/features/finance/receipt-register-server.ts \
            src/features/finance/student-ledger-excel.ts \
            src/features/import/components/ImportWorkflowWizard.tsx \
            src/routes/faturas.tsx \
            tests/documents/finance-print-identity.test.ts \
            tests/finance/receipt-register-excel.test.ts \
            tests/finance/receipt-register-filter.test.ts \
            tests/finance/student-ledger-excel.test.ts
          git diff --check
      - name: Commit the formatting changes to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/documents/print-overlays.ts \
            src/features/finance/components/ReceiptRegisterPanel.tsx \
            src/features/finance/components/StudentLedgerPanel.tsx \
            src/features/finance/receipt-register-excel.ts \
            src/features/finance/receipt-register-filter.ts \
            src/features/finance/receipt-register-server.ts \
            src/features/finance/student-ledger-excel.ts \
            src/features/import/components/ImportWorkflowWizard.tsx \
            src/routes/faturas.tsx \
            tests/documents/finance-print-identity.test.ts \
            tests/finance/receipt-register-excel.test.ts \
            tests/finance/receipt-register-filter.test.ts \
            tests/finance/student-ledger-excel.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(finance): format PR #424 with project Prettier"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
