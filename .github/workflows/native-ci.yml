name: SIGA Native CI

# Linux em cada PR que toque na app desktop (barato). Windows e macOS custam ~10×:
# só na main e à mão.
on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/desktop/**"
      - ".github/workflows/native-ci.yml"
      - ".github/workflows/desktop-release.yml"
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "scripts/desktop/**"
      - ".github/workflows/native-ci.yml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: siga-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Rust (Linux) — testes, clippy e arranque
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # A app embute só a página de arranque (o SIGA é SSR e abre-se publicado).
      - name: Página de arranque presente
        run: |
          test -f src-tauri/shell/index.html
          grep -q 'SIGA_DESKTOP_URL = "https://portal-siga.com/"' src-tauri/shell/index.html

      # O build valida também as permissões (build.rs + capabilities/allow-*).
      - name: Testes
        working-directory: src-tauri
        run: cargo test --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

  rust-check:
    name: Rust check (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked
