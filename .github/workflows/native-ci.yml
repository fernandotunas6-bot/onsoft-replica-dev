name: SIGA Native CI

# macOS/Windows runners are ~10× Linux cost. Keep them off feature PRs;
# validate Tauri/Rust on main (and manual dispatch) only.
on:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "desktop/**"
      - "scripts/check-desktop.mjs"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

concurrency:
  group: siga-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Cargo check and unit tests (locked)
        working-directory: src-tauri
        run: |
          cargo check --locked
          cargo test --locked --lib

  frontend-build:
    name: Frontend build for Tauri
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check desktop launcher
        run: bun run desktop:check

      - name: Build server frontend
        run: bun run build
