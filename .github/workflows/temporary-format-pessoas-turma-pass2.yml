name: Temp — Prettier PR 408 segunda passagem
on:
  push:
    branches:
      - feat/pessoas-turma-ux-contextual-20261029
    paths:
      - .github/workflows/temporary-format-pessoas-turma-pass2.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pessoas-turma-ux-contextual-20261029
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only updated screens and helper
        run: |
          bunx prettier --write 'src/routes/pessoas/index.tsx' 'src/routes/pedagogica_.turmas.$turmaId.tsx' src/features/academic/class-timetable-visibility.ts tests/academic/class-timetable-visibility.test.ts
      - name: Push formatted changes to isolated branch
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/routes/pessoas/index.tsx' 'src/routes/pedagogica_.turmas.$turmaId.tsx' src/features/academic/class-timetable-visibility.ts tests/academic/class-timetable-visibility.test.ts
          git commit -m 'style(ui): formatar segunda passagem com Prettier'
          git push origin HEAD:feat/pessoas-turma-ux-contextual-20261029
