name: BBB formatting verification

on:
  push:
    branches:
      - feat/bigbluebutton-server-adapter-20261008
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/features/virtual-classroom/**'
      - 'src/components/virtual-classroom/**'
      - 'src/server/integrations/bigbluebutton*'
      - 'supabase/functions/bbb-classroom/**'
      - 'tests/integrations/bigbluebutton.test.ts'
      - 'tests/virtual-classroom/**'
      - '.github/workflows/bbb-format-check.yml'

permissions:
  contents: write

jobs:
  check-bbb-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check BBB formatting
        run: bunx prettier --check src/features/virtual-classroom src/components/virtual-classroom src/server/integrations/bigbluebutton.ts src/server/integrations/bigbluebutton-policy.ts src/server/integrations/bigbluebutton-service.ts supabase/functions/bbb-classroom/index.ts tests/integrations/bigbluebutton.test.ts tests/virtual-classroom/classroom-api.test.ts

      - name: Prepare formatted BBB patch
        if: failure()
        run: |
          bunx prettier --write src/features/virtual-classroom src/components/virtual-classroom src/server/integrations/bigbluebutton.ts src/server/integrations/bigbluebutton-policy.ts src/server/integrations/bigbluebutton-service.ts supabase/functions/bbb-classroom/index.ts tests/integrations/bigbluebutton.test.ts tests/virtual-classroom/classroom-api.test.ts
          git diff --binary > bbb-format.patch
          git diff --check

      - name: Upload formatting patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bbb-format-patch
          path: bbb-format.patch
          if-no-files-found: warn

      - name: Commit scoped formatting fixes on feature branch
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/bigbluebutton-server-adapter-20261008'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/features/virtual-classroom src/components/virtual-classroom src/server/integrations/bigbluebutton.ts src/server/integrations/bigbluebutton-policy.ts src/server/integrations/bigbluebutton-service.ts supabase/functions/bbb-classroom/index.ts tests/integrations/bigbluebutton.test.ts tests/virtual-classroom/classroom-api.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(bbb): apply scoped Prettier formatting"
            git push origin HEAD:feat/bigbluebutton-server-adapter-20261008
          fi
