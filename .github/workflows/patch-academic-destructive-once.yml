name: One-shot Academic Destructive Patch

on:
  push:
    branches:
      - fix/import-academic-rls-20260903

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[destructive-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-academic-rls-20260903
          fetch-depth: 0

      - name: Patch academic facade safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/features/academic/server.ts')
          text = path.read_text()

          anchors = [
              ('  listAssessmentsInputSchema,\n  listPedagogicalWorkspaceInputSchema,',
               '  listAssessmentsInputSchema,\n  deleteAssessmentInputSchema,\n  listPedagogicalWorkspaceInputSchema,'),
              ('  deleteAssessmentItem,\n', ''),
          ]
          for old, new in anchors:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one anchor, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          insertion_anchor = 'export const getStudentAcademicHistory = createServerFn({ method: "GET" })'
          if text.count(insertion_anchor) != 1:
              raise SystemExit('Could not uniquely locate getStudentAcademicHistory insertion anchor')

          secure_delete = r'''export const deleteAssessmentItem = createServerFn({ method: "POST" })
            .middleware([requireSupabaseAuth])
            .validator((input: unknown) => deleteAssessmentInputSchema.parse(input))
            .handler(async ({ data, context }) => {
              if (!context) throw new Error("Não autenticado.");
              const membership = await requireAcademicMembership(context.userId);
              const db = await loadSgaAdminClient();

              if (isTeacherOnly(membership)) {
                const scope = await resolveTeacherScope(db, membership.schoolId, context.userId);
                if (!scope.teacherId) {
                  throw new Error("Perfil de professor não associado a esta escola.");
                }
                const { data: item, error: itemError } = await db
                  .from("siga_assessment_items")
                  .select("id, class_group_id, subject_id")
                  .eq("id", data.itemId)
                  .eq("school_id", membership.schoolId)
                  .maybeSingle();
                if (itemError) {
                  throw publicDatabaseError(itemError, "Não foi possível validar a avaliação.");
                }
                if (!item) throw new Error("Avaliação não encontrada nesta escola.");
                if (!scope.pairKeys.has(pairKey(item.class_group_id, item.subject_id))) {
                  throw new Error("O professor só pode eliminar avaliações da sua turma e disciplina atribuídas.");
                }
              }

              const { data: deletedCount, error } = await db.rpc("delete_sga_assessment_item", {
                p_school_id: membership.schoolId,
                p_item_id: data.itemId,
                p_actor_id: context.userId,
                p_force: data.force,
              });
              if (error) {
                throw publicDatabaseError(error, "Não foi possível eliminar a avaliação.");
              }
              return { success: true, deletedScoresCount: Number(deletedCount ?? 0) };
            });

          '''

          text = text.replace(insertion_anchor, secure_delete + insertion_anchor, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/patch-academic-destructive-once.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit one-shot patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(academic): route destructive assessment delete through guarded RPC [destructive-patch]"
          git push origin HEAD:fix/import-academic-rls-20260903
