name: Refresh Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-bun-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate lockfile
        id: install
        continue-on-error: true
        run: bun install 2>&1 | tee lock-refresh.log
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lock-refresh-diagnostic
          path: lock-refresh.log
      - name: Commit lockfile
        if: steps.install.outcome == 'success'
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh bun lockfile"
          git push
      - name: Fail when install failed
        if: steps.install.outcome != 'success'
        run: exit 1
