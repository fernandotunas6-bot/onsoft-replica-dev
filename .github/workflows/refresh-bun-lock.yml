name: Refresh Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/refresh-bun-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): synchronize bun lockfile"
          git push
