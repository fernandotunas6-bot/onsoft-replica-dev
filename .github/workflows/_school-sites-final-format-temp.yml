name: School Sites Final Format (temporary)
on:
  push:
    branches: [feat/school-sites-multitenant-20261020]
    paths: [".github/workflows/_school-sites-final-format-temp.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format school-sites changes
        run: |
          bunx prettier --write \
            src/lib/public-paths.ts \
            src/features/school-site/persistence.ts \
            src/features/school-site/editor-server.ts \
            src/features/school-site/public-server.ts \
            tests/school-website/site-persistence.test.ts \
            tests/school-website/public-site-isolation.test.ts \
            tests/school-website/public-route-access.test.ts \
            tests/security/rls-client-migration.test.ts
      - name: Enforce ISPAB source preservation
        run: git diff --exit-code -- painel/escolas/
      - name: Commit formatted feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/public-paths.ts src/features/school-site/ tests/school-website/ tests/security/rls-client-migration.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(school-sites): formatar persistência RLS e testes"
            git fetch origin feat/school-sites-multitenant-20261020
            git rebase origin/feat/school-sites-multitenant-20261020
            git push origin HEAD:feat/school-sites-multitenant-20261020
          fi
