name: Estudo — YFT (publicar na Cloudflare)
# Publica o YFT na conta Cloudflare do SIGA. Corre só à mão
# (Actions → este workflow → Run workflow), porque o build do Flutter não
# corre em macOS 12 (precisa de 14+) nem o workerd dos testes (13.5+).
#
# Faz o mesmo que estudo/yft-school-system/scripts/publicar-siga.sh na máquina
# do autor; ver estudo/yft-school-system/PUBLICAR_SIGA.md.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN            Workers Scripts/Routes, D1, R2, Custom Domains: Edit
#   FIREBASE_WEB_API_KEY            apiKey web do projecto Firebase
#   SUPER_ADMIN_API_KEY             ≥ 32 caracteres, partilhado com o super-admin
#   FIREBASE_SERVICE_ACCOUNT_JSON   opcional (apagar contas Firebase de encarregados)
# Variável:
#   CLOUDFLARE_ACCOUNT_ID           701800d01d428c5141fa1fdb60ee01ae
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "Onde publicar"
        type: choice
        default: teste
        options:
          - teste
          - dominio
      confirmar_dominio:
        description: "Só para alvo=dominio: escrever TROCAR m.portal-siga.com"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: yft-publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    # Criar o environment "yft-publicacao" com required reviewers dá um
    # segundo travão humano antes de qualquer escrita na Cloudflare.
    environment: yft-publicacao
    defaults:
      run:
        working-directory: estudo/yft-school-system
    steps:
      - uses: actions/checkout@v4

      - name: Travão do domínio
        if: inputs.alvo == 'dominio'
        run: |
          if [ "${{ inputs.confirmar_dominio }}" != "TROCAR m.portal-siga.com" ]; then
            echo "::error::Para trocar o domínio, escrever exactamente: TROCAR m.portal-siga.com"
            exit 1
          fi
          echo "A rota m.portal-siga.com tem de já estar removida do Worker"
          echo "siga-plus-mobile-v4-domain (passo 4.1 do PUBLICAR_SIGA.md)."
          echo "Estado actual do domínio:"
          curl -s -o /dev/null -w "  HTTP %{http_code}\n" https://m.portal-siga.com/ || true

      # Versão do autor (.metadata). Com Flutter 3.47, lucide_icons 0.257 não
      # compila (IconData passou a final).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Análise e testes
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Testes do Worker
        working-directory: estudo/yft-school-system/school-worker
        run: |
          npm ci --ignore-scripts
          npx vitest run

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          SUPER_ADMIN_API_KEY: ${{ secrets.SUPER_ADMIN_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: scripts/publicar-siga.sh "${{ inputs.alvo }}"
