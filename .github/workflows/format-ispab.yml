name: Format ISPAB

on:
  push:
    branches:
      - feat/ispab-propinas-entrega-segura-20261031
    paths:
      - .github/workflows/format-ispab.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/features/finance/student-portal-ledger.ts src/features/school-website/StudentWebsitePortal.tsx src/features/school-website/student-portal-bridge.ts src/features/school-website/student-portal-server.ts src/features/school-website/render-site.ts src/features/auth/portal-login-return.ts src/routes/portal.tsx tests/finance/student-portal-ledger.test.ts tests/school-website/student-portal-ui.test.tsx tests/school-website/student-portal-server.test.ts tests/school-website/student-portal-bridge.test.ts tests/school-website/ispab-propinas-scope.test.ts
      - run: |
          git add src tests
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit -m "style: format ISPAB flow"
          git push
