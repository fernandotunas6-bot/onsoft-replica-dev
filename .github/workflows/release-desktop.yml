name: Release Desktop App (Tauri)

on:
  push:
    tags:
      - "v*"
  # Alternativa a enviar a tag: Actions → Release Desktop App → Run workflow, no main,
  # com a versão da app. O primeiro job cria a tag v<versão> no commit do main.
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da app (ex.: 1.1.0); cria a tag v<versão> no main"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release before native runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-desktop.mjs

      # Com a tag enviada, o check-desktop já confirmou tag = versão. No arranque manual,
      # confirmar aqui e criar a tag (com o GITHUB_TOKEN não dispara outra execução).
      - name: Create the release tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          expected=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$expected" ]; then
            echo "::error::A versão pedida ($VERSION) não é a da app ($expected)."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Corra este workflow a partir do main."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::A tag $RELEASE_TAG já existe."
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

  build-tauri:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon & Intel
            args: "--target universal-apple-darwin"
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04" # .deb, .rpm e AppImage (glibc 2.35+)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: System dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --prefix desktop

      - name: Validate template and release tag
        run: node scripts/check-desktop.mjs

      # Actualizações automáticas só com as duas chaves (docs/desktop/PUBLICAR_VERSOES.md).
      # Sem elas a versão sai sem updater e a app continua a abrir.
      - name: Configure signed updates
        env:
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          REPO: ${{ github.repository }}
        run: node scripts/desktop/release-config.mjs

      - name: Build Tauri app
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "SIGA Desktop ${{ env.RELEASE_TAG }}"
          releaseBody: |
            App do SIGA Plus para computador: o portal da escola com impressão directa, catracas e sessão protegida por PIN.

            **Transferir e instalar:** https://www.portal-siga.com/download

            | Sistema | Ficheiro |
            |---|---|
            | Windows 10/11 (64 bits) | `SIGA-Desktop-Windows-x64-setup.exe` |
            | macOS 11+ com o Safari 16.4+ (Intel e Apple Silicon) | `SIGA-Desktop-macOS-universal.dmg` |
            | Ubuntu / Debian | `SIGA-Desktop-Linux-amd64.deb` |
            | Fedora / openSUSE | `SIGA-Desktop-Linux-x86_64.rpm` |
            | Outras distribuições Linux | `SIGA-Desktop-Linux-x86_64.AppImage` |

            Na primeira instalação, o Windows (SmartScreen) e o macOS (Gatekeeper) pedem confirmação, porque os instaladores ainda não têm certificado de editor: os passos estão na página de transferência. Somas SHA-256 em `SHA256SUMS.txt`.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }} -- --locked

      # Cópias com nomes fixos: o site (painel/web, /download) liga a
      # releases/latest/download/<nome fixo>, que serve sempre a última versão publicada.
      - name: Upload installers with fixed names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/desktop/stable-assets.mjs stable-assets > stable-assets.txt
          while IFS= read -r file; do
            gh release upload "$TAG" "$file" --clobber --repo "$REPO"
          done < stable-assets.txt
