name: Estudo — YFT (APK Android)
# Constrói o APK Android do YFT (estudo/yft-school-system). Corre só à mão
# (Actions → este workflow → Run workflow), porque este Mac não corre o Flutter.
#
# Com «publicar», põe os APK na release «android» com nomes fixos, que o site
# (painel/web, /download) oferece em releases/download/android/<nome>. Essa
# release nunca é a «latest» do repositório: o «latest» é do SIGA Desktop, e os
# botões dele ligam a releases/latest/download/<nome>.
#
# Variável:
#   YFT_GOOGLE_SERVICES_JSON   conteúdo do google-services.json da app Android
#                              ao.onsoft.sigaplus no Firebase siga-plus-integracoes
#                              (valores públicos; fora do Git por regra do projecto)
#   YFT_API_BASE_URL           opcional; por omissão o Worker de teste do YFT
# Segredos (para publicar; sem eles o APK sai assinado com a chave de depuração):
#   ANDROID_KEYSTORE_BASE64    o .jks da chave de upload, em base64
#   ANDROID_KEYSTORE_PASSWORD  a palavra-passe da chave (PKCS12: a mesma no ficheiro e na chave)
on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão da app (ex.: 1.0.0)"
        required: true
      publicar:
        description: "Publicar na release «android» (o site passa a oferecê-la)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: yft-android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estudo/yft-school-system
    env:
      API_BASE_URL: ${{ vars.YFT_API_BASE_URL || 'https://siga-yft.valentinocanguele.workers.dev' }}
      VERSAO: ${{ inputs.versao }}
      PUBLICAR: ${{ inputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        run: |
          if ! [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: $VERSAO (use X.Y.Z)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Versão do autor (.metadata). Com Flutter 3.47, lucide_icons 0.257 não
      # compila (IconData passou a final).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      # No Android, main.dart inicializa o Firebase a partir do google-services.json
      # nativo: sem ele o Gradle pára, e com o pacote errado o login falha.
      - name: Firebase Android (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.YFT_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Falta a variável YFT_GOOGLE_SERVICES_JSON (Firebase → siga-plus-integracoes → app Android ao.onsoft.sigaplus)."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("android/app/google-services.json", "utf8"));
            const pkgs = (d.client || []).map((c) => c.client_info.android_client_info.package_name);
            if (d.project_info.project_id !== "siga-plus-integracoes") throw new Error("Projecto Firebase errado: " + d.project_info.project_id);
            if (!pkgs.includes("ao.onsoft.sigaplus")) throw new Error("Sem a app ao.onsoft.sigaplus: " + pkgs.join(", "));
            console.log("google-services.json: siga-plus-integracoes / ao.onsoft.sigaplus");
          '

      - name: Chave de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            if [ "$PUBLICAR" = "true" ]; then
              echo "::error::Sem ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD não se publica: cada APK teria outra assinatura e não actualizava por cima do anterior."
              exit 1
            fi
            echo "::warning::Sem chave de release: APK assinado com a chave de depuração, só para testar."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=app/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=siga-plus"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Um APK por arquitectura: ~3× mais pequeno que o universal, o que conta nos
      # dados móveis. arm64 serve quase todos os telemóveis; armv7, os antigos.
      - name: Construir
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name="$VERSAO" --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          out=build/app/outputs/flutter-apk
          mkdir -p dist
          cp "$out/app-arm64-v8a-release.apk" dist/SIGA-Plus-Android-arm64.apk
          cp "$out/app-armeabi-v7a-release.apk" dist/SIGA-Plus-Android-armv7.apk
          (cd dist && sha256sum SIGA-Plus-Android-*.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: siga-plus-android-${{ inputs.versao }}
          path: estudo/yft-school-system/dist/
          retention-days: 14

      - name: Publicar na release «android»
        if: inputs.publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          notes="SIGA Plus para Android, versão $VERSAO.

          **Transferir:** https://www.portal-siga.com/download

          | Telemóvel | Ficheiro |
          |---|---|
          | A maioria (Android 64 bits) | \`SIGA-Plus-Android-arm64.apk\` |
          | Mais antigos (32 bits) | \`SIGA-Plus-Android-armv7.apk\` |

          O Android pede autorização para instalar apps fora da Play Store: os passos estão na página de transferência. Somas SHA-256 em \`SHA256SUMS-android.txt\`."
          if ! gh release view android --repo "$REPO" >/dev/null 2>&1; then
            gh release create android --repo "$REPO" --target "$GITHUB_SHA" \
              --title "SIGA Plus Android" --notes "$notes" --latest=false
          fi
          gh release upload android --repo "$REPO" --clobber \
            dist/SIGA-Plus-Android-arm64.apk dist/SIGA-Plus-Android-armv7.apk dist/SHA256SUMS-android.txt
          gh release edit android --repo "$REPO" --title "SIGA Plus Android $VERSAO" --notes "$notes" --latest=false
          echo "Publicada: https://github.com/$REPO/releases/tag/android"
