name: Publicar versão do SIGA Desktop

# O release-desktop.yml deixa cada versão em rascunho (as escolas não a vêem).
# Este workflow publica-a com um clique (Actions → Run workflow), só depois de
# confirmar que os instaladores com nome fixo estão lá: são esses que o site
# (painel/web, /download) oferece em releases/latest/download/<nome>.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versão a publicar (ex.: v1.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm installers and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: $TAG (use vX.Y.Z)"
            exit 1
          fi
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')
          missing=0
          for file in \
            SIGA-Desktop-Windows-x64-setup.exe \
            SIGA-Desktop-macOS-universal.dmg \
            SIGA-Desktop-Linux-x86_64.AppImage \
            SIGA-Desktop-Linux-amd64.deb \
            SIGA-Desktop-Linux-x86_64.rpm; do
            if ! grep -qx "$file" <<<"$assets"; then
              echo "::error::Falta $file na release $TAG"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "Publicada: https://github.com/$REPO/releases/tag/$TAG"
