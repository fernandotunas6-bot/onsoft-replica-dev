name: CRUD security diagnostic (one-off)

on:
  push:
    branches:
      - feat/crud-premium-engineering-20261028
    paths:
      - .github/workflows/crud-security-diagnostic.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comparar acessos privilegiados com a base original
        shell: bash
        run: |
          mkdir -p /tmp/siga-base
          git archive 8ea7851bb5c7ed72536ebbd6abc5e9675a4d8fbf src | tar -x -C /tmp/siga-base
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          function scan(dir, prefix = "src") {
            const found = [];
            for (const name of fs.readdirSync(dir)) {
              const file = path.join(dir, name);
              const rel = path.posix.join(prefix, name);
              if (fs.statSync(file).isDirectory()) {
                found.push(...scan(file, rel));
                continue;
              }
              if (!/\.tsx?$/.test(name)) continue;
              const raw = fs.readFileSync(file, "utf8");
              const code = raw.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/[^\n]*/g, "");
              if (/loadSgaAdminClient\s*\(/.test(code)) found.push(rel);
            }
            return found.sort();
          }
          const oldFiles = scan("/tmp/siga-base/src");
          const newFiles = scan("src");
          const oldSet = new Set(oldFiles);
          const newSet = new Set(newFiles);
          console.log("old_count", oldFiles.length, "new_count", newFiles.length);
          console.log("added_calls", newFiles.filter(f => !oldSet.has(f)));
          console.log("removed_calls", oldFiles.filter(f => !newSet.has(f)));
          const source = fs.readFileSync("tests/security/rls-client-migration.test.ts", "utf8");
          const region = source.split("const PRIVILEGIO_POR_DESENHO = new Set([")[1].split("]);")[0];
          const allowed = new Set([...region.matchAll(/"([^"]+\.tsx?)"/g)].map(m => m[1]));
          const inDebt = newFiles.filter(f => !allowed.has(f));
          console.log("unapproved_privilege_count", inDebt.length);
          console.log("unapproved_privilege_files", JSON.stringify(inDebt));
          console.log("allowed_privilege_files", JSON.stringify(newFiles.filter(f => allowed.has(f))));

          NODE

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Verificar efeitos da geração de código
        run: bun run build
      - name: Identificar ficheiros não rastreados que usam acesso privilegiado
        shell: bash
        run: |
          git status --short --untracked-files=all src
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const {execFileSync} = require("child_process");
          const tracked = new Set(execFileSync("git",["ls-files","src"],{encoding:"utf8"}).trim().split("\n"));
          const found = [];
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir,name);
              if (fs.statSync(full).isDirectory()) { walk(full); continue; }
              if (!/\.tsx?$/.test(name)) continue;
              const source = fs.readFileSync(full,"utf8");
              const code = source.replace(/\/\*[\s\S]*?\*\//g,"").replace(/\/\/[^\n]*/g,"");
              if (/loadSgaAdminClient\s*\(/.test(code)) found.push(full);
            }
          }
          walk("src");
          console.log("after_build_all_privileged",found.length);
          console.log("after_build_untracked_privileged",JSON.stringify(found.filter(f=>!tracked.has(f))));
          NODE
