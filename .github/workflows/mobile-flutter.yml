name: SIGA Flutter — validate migration
on:
  push:
    branches: [feat/siga-flutter-motion-2026, 'ccr-**']
    paths: ['mobile-flutter/**', '.github/workflows/mobile-flutter.yml']
  pull_request:
    paths: ['mobile-flutter/**', '.github/workflows/mobile-flutter.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
        # Formatar aqui escondia o desvio: o passo passava sempre e o diff
        # chegava à revisão desformatado.
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
        # As guardas do backend isolado são código executável com testes; sem
        # este passo nenhum deles corria em CI.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/*.test.mjs
      - run: flutter build web --release --no-web-resources-cdn --pwa-strategy=none
      - uses: actions/upload-artifact@v4
        with:
          name: siga-flutter-validation
          path: |
            mobile-flutter/build/web/
            mobile-flutter/pubspec.lock
          if-no-files-found: error
