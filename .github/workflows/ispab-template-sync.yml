name: Sincronização pontual do modelo ISPAB

on:
  push:
    branches:
      - feat/ispab-propinas-entrega-segura-20261031
    paths:
      - ".github/workflows/ispab-template-sync.yml"

permissions:
  contents: write

jobs:
  sync-template:
    if: github.repository == 'fernandotunas6-bot/onsoft-replica-dev' && github.ref == 'refs/heads/feat/ispab-propinas-entrega-segura-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Gerar modelo de website a partir das páginas propostas
        run: node scripts/siga/sync-school-website-template.mjs
      - name: Versionar apenas o manifesto gerado
        run: |
          git add src/features/school-website/template.json
          if git diff --cached --quiet; then
            echo "Manifesto já sincronizado."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore(ispab): sync school website content manifest"
          git push origin HEAD:"${GITHUB_REF_NAME}"
