name: SIGA Native Lockfile Sync

on:
  push:
    branches:
      - siga-native-2-foundation
    paths:
      - '.github/workflows/native-lockfile-sync.yml'
      - 'package.json'
      - 'src-tauri/Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lockfiles:
    name: Regenerate Bun and Cargo lockfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: siga-native-2-foundation

      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate bun.lock
        run: bun install

      - name: Regenerate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Commit generated lockfiles
        shell: bash
        run: |
          git add bun.lock src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles are already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(native): synchronize Bun and Cargo lockfiles'
          git push origin HEAD:siga-native-2-foundation
