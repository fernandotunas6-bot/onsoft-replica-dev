name: Mobile V4 — validate and package preview

on:
  pull_request:
    paths:
      - "mobile-v4/**"
      - "src/features/mobile-v4/**"
      - "src/routes/api/mobile-v4/**"
      - "tests/mobile-v4/**"
      - ".github/workflows/mobile-v4-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-v4-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-v4:
    name: Test and build isolated Mobile V4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile-v4/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Build institutional host module
        run: npm run build:institutional
      - name: Upload institutional host module
        uses: actions/upload-artifact@v4
        with:
          name: mobile-v4-institutional-host
          path: mobile-v4/dist-institutional/
          retention-days: 7
      - name: Verify PWA
        run: npm run check:pwa
      - name: Generate formatting diagnostics
        if: steps.formatting.outcome != 'success'
        run: |
          npx prettier --write src tests scripts index.html vite.config.ts vite.institutional.config.ts tsconfig.json package.json public/manifest.webmanifest public/_worker.js docs README.md
          git diff -- src tests scripts index.html vite.config.ts vite.institutional.config.ts tsconfig.json package.json public/manifest.webmanifest public/_worker.js docs README.md > mobile-v4-formatting.patch
          test -s mobile-v4-formatting.patch
      - name: Upload formatting diagnostics
        if: steps.formatting.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-v4-formatting-patch
          path: mobile-v4/mobile-v4-formatting.patch
          retention-days: 7
      - name: Enforce formatting gate
        if: steps.formatting.outcome != 'success'
        run: |
          echo "Prettier failed: preview packaging is blocked."
          exit 1
      - name: Package isolated preview
        uses: actions/upload-artifact@v4
        with:
          name: siga-mobile-v4-preview
          path: mobile-v4/dist/
          if-no-files-found: error
          retention-days: 14
