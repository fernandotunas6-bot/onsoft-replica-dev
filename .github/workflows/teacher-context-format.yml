name: Format teacher contextual release
on:
  push:
    branches:
      - feat/teacher-profile-360-context-20261029
    paths:
      - .github/workflows/teacher-context-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only new context files and touched profile
        run: |
          bunx prettier --write             src/features/people/teacher-context-catalog.ts             src/features/people/TeacherContextHub.tsx             src/features/people/teacher-weekly-schedule.ts             src/features/people/TeacherProfile360.tsx             src/routes/professores/'$teacherId.tsx'             tests/people/teacher-context-catalog.test.ts
          git add -- src/features/people/teacher-context-catalog.ts             src/features/people/TeacherContextHub.tsx             src/features/people/teacher-weekly-schedule.ts             src/features/people/TeacherProfile360.tsx             src/routes/professores/'$teacherId.tsx'             tests/people/teacher-context-catalog.test.ts
          if ! git diff --cached --quiet; then
            git config user.name 'siga-release-formatter'
            git config user.email 'siga-release-formatter@users.noreply.github.com'
            git commit -m 'style(teacher): format contextual profile for release [skip ci]'
            git push origin HEAD:feat/teacher-profile-360-context-20261029
          fi
