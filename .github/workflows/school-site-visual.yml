name: School Sites — visual e isolamento sem produção

on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/school-site/**"
      - "src/routes/site.tsx"
      - "src/lib/public-paths.ts"
      - "tests/e2e/school-site-visual.spec.ts"
      - ".github/workflows/school-site-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: school-site-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Chrome — 6 larguras, acessibilidade e navegação
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      VITE_SIGA_URL: "http://localhost:3006"
      SIGA_SCHOOL_SITE_VISUAL_E2E: "1"
      # Sem acesso a produção: todas as consultas a Supabase apontam
      # para um endpoint local inexistente; a API escolar usa fixture no browser.
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_fake_school_visual_only"
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_fake_school_visual_only"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências fixadas
        run: bun install --frozen-lockfile
      - name: Preservar website ISPAB original
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- painel/escolas/ | grep .; then
            echo "::error::O site ISPAB original não pode ser alterado."
            exit 1
          fi
      - name: Testar website em Chrome local com dados fictícios
        run: |
          set -e
          google-chrome --version
          bun run dev > /tmp/school-site-visual-vite.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 100); do
            if curl -fsS http://localhost:3006/site >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 75 /tmp/school-site-visual-vite.log
            exit 1
          fi
          bunx playwright test tests/e2e/school-site-visual.spec.ts --workers=1
