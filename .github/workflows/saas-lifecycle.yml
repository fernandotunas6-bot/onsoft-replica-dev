name: SaaS — avisos diários (fim do trial e registos por concluir)

on:
  schedule:
    # Todos os dias às 07:23 UTC (08:23 em Luanda): antes do dia de trabalho
    # das escolas. Um minuto fora da hora certa para não coincidir com o pico.
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: saas-lifecycle
  cancel-in-progress: false

jobs:
  run:
    name: Avisos de fim do período experimental e lembretes de registo
    runs-on: ubuntu-latest
    steps:
      - name: Verificar segredo
        id: secrets
        env:
          SIGA_CRON_SECRET: ${{ secrets.SIGA_CRON_SECRET }}
        run: |
          if [ -z "$SIGA_CRON_SECRET" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SIGA_CRON_SECRET em falta — é o mesmo segredo que o deploy publica no Worker."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Correr a tarefa no SIGA
        if: steps.secrets.outputs.skip != 'true'
        env:
          SIGA_CRON_SECRET: ${{ secrets.SIGA_CRON_SECRET }}
          SIGA_URL: ${{ vars.SIGA_URL || 'https://portal-siga.com' }}
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SIGA_CRON_SECRET" \
            "$SIGA_URL/api/cron/saas-lifecycle")
          cat response.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::A tarefa respondeu HTTP $status"
            exit 1
          fi
