name: Finance PR transitive security fix (one-time)

on:
  pull_request:
    paths:
      - ".github/workflows/finance-one-time-re2js.yml"

permissions:
  contents: write

jobs:
  patch-re2js:
    if: github.event.pull_request.number == 424 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Upgrade only transitive re2js within Firebase range
        run: |
          bun update re2js
          node -e 'const fs=require("fs");const lock=fs.readFileSync("bun.lock","utf8");const m=lock.match(/re2js@([0-9]+)[.]([0-9]+)[.]([0-9]+)/);if(!m || Number(m[1])<2 || (Number(m[1])===2 && (Number(m[2])<8 || (Number(m[2])===8 && Number(m[3])<7))))throw Error("re2js still vulnerable");'
          bun install --frozen-lockfile
      - name: Audit high and critical vulnerabilities
        run: bun audit --audit-level=high
      - name: Verify update changes only lockfile
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "bun.lock" || { echo "Unexpected files changed: $CHANGED"; exit 1; }
      - name: Commit audited lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "fix(security): update transitive re2js to patched version"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
