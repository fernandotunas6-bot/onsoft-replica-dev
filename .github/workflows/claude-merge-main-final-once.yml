name: Claude final integration with current main

on:
  pull_request:
    paths:
      - ".github/workflows/claude-merge-main-final-once.yml"

permissions:
  contents: write

jobs:
  integrate-and-test:
    if: github.event.pull_request.number == 426 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/claude-recent-20261030
          fetch-depth: 0
      - name: Reconcile with current main without rewriting history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          echo "Current main: $(git rev-parse origin/main)"
          if ! git merge --no-ff origin/main -m "merge(main): retain latest production while integrating Claude"; then
            git diff --name-only --diff-filter=U
            echo "::error::Conflicts must be resolved before deployment"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript and application build
        run: |
          bun run typecheck
          bun run build
      - name: Claude and finance regression tests
        run: |
          bun run test tests/hr/staff-positions-server.test.ts tests/students/student-row-actions.test.tsx tests/ui/personal-notifications-read.test.tsx tests/finance/receipt-register-rls.test.ts tests/finance/tuition-batch.test.ts tests/security/rls-client-migration.test.ts
      - name: SQL migration tests in isolated PGlite
        run: |
          npm install --no-save --silent --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.3.14
          export SIGA_SQL_TEST_MODULE_PATH="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite/dist/index.js"
          node tests/sql/hr-employments-one-current.mjs
          node tests/sql/announcements-audience-current-guardians.mjs
          node tests/sql/teacher-periods-class-archive.mjs
      - name: Finalise tested candidate and remove temporary workflow
        run: |
          git rm -f .github/workflows/claude-merge-main-final-once.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(ci): remove temporary Claude integration gate"
          git push origin HEAD:integration/claude-recent-20261030
