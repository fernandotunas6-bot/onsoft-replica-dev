name: CRUD Premium — gate staging antes do deploy

on:
  push:
    branches:
      - feat/crud-premium-engineering-20261028
    paths:
      - .github/workflows/crud-staging-deploy-gate.yml

permissions:
  contents: read

concurrency:
  group: crud-staging-release-gate
  cancel-in-progress: false

jobs:
  staging-gate:
    name: Release contracts e E2E isolado em staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      SIGA_E2E_ALLOW_WRITES: "1"
      SIGA_E2E_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Garantir staging isolado (nunca base real)
        env:
          STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STAGING_PUBLIC: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$STAGING_REF" ] || [ -z "$STAGING_URL" ] || [ -z "$STAGING_KEY" ] || [ -z "$STAGING_PUBLIC" ]; then
            echo "::error::Staging Supabase independente não está completamente configurado. Não publicar em produção."
            exit 1
          fi
          if [ "$STAGING_REF" = "xodgfmxiaunpamctfeea" ] || [[ "$STAGING_URL" == *"xodgfmxiaunpamctfeea"* ]]; then
            echo "::error::Staging não pode apontar para Supabase produção."
            exit 1
          fi
          echo "Staging independente identificado sem revelar segredos."
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          bun install --frozen-lockfile
          npm ci --prefix painel/web
          npm ci --prefix painel/admin
          npm ci --prefix painel/docs
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Contratos de publicação sem base real
        run: node scripts/siga/check-release-contracts.mjs
      - name: Preparar credenciais staging
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
        run: node scripts/siga/prepare-ci-env.mjs
      - name: Arrancar ambiente E2E
        run: node scripts/siga/start-ecosystem-ci.mjs
      - name: Aguardar portas
        env:
          SIGA_E2E_WAIT_ATTEMPTS: "120"
        run: node scripts/siga/wait-ecosystem.mjs
      - name: Testes autenticados comercial + matrícula
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          SIGA_E2E_LIVE: "1"
          CI: "true"
        run: node scripts/siga/e2e-ecosystem-live.mjs
      - name: Relatórios em caso de erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crud-staging-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Parar ambiente de testes
        if: always()
        run: node scripts/siga/stop-ecosystem-ci.mjs
