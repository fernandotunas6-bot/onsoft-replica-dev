name: School Sites Final Prettier (temporary)
on:
  push:
    branches: [feat/school-sites-multitenant-20261020]
    paths: [".github/workflows/_school-sites-format-release-temp.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Formatar somente código do website escolar
        run: |
          bunx prettier --write \
            src/features/school-site/ \
            src/routes/configuracoes_.site.tsx \
            src/lib/public-paths.ts \
            tests/school-website/ \
            tests/security/school-website-draft-rls.test.ts
          git diff --exit-code -- painel/escolas/
      - name: Commit da formatação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/school-site/ src/routes/configuracoes_.site.tsx src/lib/public-paths.ts tests/school-website/ tests/security/school-website-draft-rls.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(school-sites): aplicar formatação oficial Prettier"
            git fetch origin feat/school-sites-multitenant-20261020
            git rebase origin/feat/school-sites-multitenant-20261020
            git push origin HEAD:feat/school-sites-multitenant-20261020
          fi
