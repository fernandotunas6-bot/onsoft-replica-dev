name: School Site Local Visual Smoke (temporary)
on:
  push:
    branches: [feat/school-sites-multitenant-20261020]
    paths: [".github/workflows/_school-site-visual-smoke-temp.yml"]
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
      VITE_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_URL: "http://127.0.0.1:54321"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_fake_school_visual_only"
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_fake_school_visual_only"
      SIGA_SCHOOL_SITE_VISUAL_E2E: "1"
      VITE_SIGA_URL: "http://localhost:3006"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Dependências já fixadas no lockfile
        run: bun install --frozen-lockfile
      - name: Testes visuais sem Supabase real nem logins
        run: |
          set -e
          git diff --exit-code HEAD -- painel/escolas/
          google-chrome --version
          bun run dev > /tmp/school-visual-vite.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 100); do
            if curl -fsS http://localhost:3006/site >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 75 /tmp/school-visual-vite.log
            exit 1
          fi
          bunx playwright test tests/e2e/school-site-visual.spec.ts --workers=1
