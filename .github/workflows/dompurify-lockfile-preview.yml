name: Verificar actualização segura do DOMPurify

on:
  pull_request:
    paths:
      - ".github/workflows/dompurify-lockfile-preview.yml"
      - "bun.lock"

permissions:
  contents: read

jobs:
  lockfile:
    name: Gerar proposta de lockfile (sem publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Actualizar apenas a dependência transitiva
        run: bun update dompurify --lockfile-only
      - name: Inspeccionar a alteração
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          echo '=== DOMPurify candidate from Bun ==='
          git diff -- bun.lock
          if ! grep -Eq '"dompurify": \["dompurify@3\.4\.(17|[2-9][0-9])' bun.lock; then
            echo 'A versão de DOMPurify ainda não está corrigida'
            exit 1
          fi
          echo '=== Dependências afectadas ==='
          git diff --stat
      - name: Validar o lockfile gerado
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
