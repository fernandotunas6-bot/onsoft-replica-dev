name: School sites routegen (temporary)
on:
  push:
    branches: [feat/school-sites-multitenant-20261020]
    paths: [".github/workflows/_school-sites-routegen-temp.yml"]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Formatar site adaptador sem tocar no ISPAB
        run: bunx prettier --write src/routes/site.tsx
      - name: Regenerar rotas TanStack pelo plugin Vite existente
        run: |
          bun run build > /tmp/siga-school-sites-build.log 2>&1 || {
            echo "::warning::O build inicial não concluiu; as rotas serão verificadas pelo CI."
            tail -n 45 /tmp/siga-school-sites-build.log
          }
          grep -q "\'/site\'" src/routeTree.gen.ts
          grep -q "\'/configuracoes_/site\'" src/routeTree.gen.ts
          grep -q "\'/api/public/school-site\'" src/routeTree.gen.ts
      - name: Guardar apenas a rota gerada e o formato da nova página
        run: |
          git diff --exit-code -- painel/escolas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts src/routes/site.tsx
          if ! git diff --cached --quiet; then
            git commit -m "chore(school-sites): actualizar mapa TanStack e formatar layout institucional"
            git fetch origin feat/school-sites-multitenant-20261020
            git rebase origin/feat/school-sites-multitenant-20261020
            git push origin HEAD:feat/school-sites-multitenant-20261020
          fi
