name: Generate Bun lock artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/workflows/generate-bun-lock.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve dependencies
        run: |
          set +e
          bun install > bun-install.log 2>&1
          echo $? > bun-install.exit
          true
      - name: Upload generated lock and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-lock-diagnostics
          path: |
            bun.lock
            bun-install.log
            bun-install.exit
          if-no-files-found: warn
