name: Deploy produção

# Publica o ecossistema (DOC, WEB, ADMIN, PAYFLOW, SIGA) na Cloudflare a partir
# da `main`. Até aqui a publicação era feita à mão, e a produção podia correr
# código que não estava na `main` (28/09: deploy às 19h, último commit às 07h).
#
# Regras:
# - só publica depois de tipos, lint e testes passarem sobre o mesmo commit;
# - uma publicação de cada vez, e nunca cancelada a meio (concurrency);
# - corre no ambiente GitHub `production`: é lá que ficam os segredos, e é lá
#   que se pode exigir aprovação antes de publicar (Settings → Environments);
# - as migrações D1 do PayFlow correm antes do Worker novo (deploy-all.mjs).
#
# Segredos esperados no ambiente `production` (os opcionais podem faltar; um
# segredo vazio não apaga o que já está na Cloudflare, ver worker-secrets.mjs):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY,
#   e os de scripts/worker-secrets.mjs.
# Variável opcional: PAYFLOW_R2_BUCKET (quando o R2 estiver activo).

on:
  push:
    branches: [main]
    # Um commit só de documentação não republica os 5 apps. Mesma lista do
    # `ci.yml`, que já a tinha: este era o único workflow sem filtro de caminho,
    # e a 06/10 um commit de documentação na `main` republicou tudo sem
    # necessidade. Um commit misto (código + documentos) continua a publicar,
    # porque toca em caminhos que não estão aqui; e o `workflow_dispatch`
    # abaixo publica sempre, qualquer que seja o que mudou.
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verificar antes de publicar
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Confirmar contratos dependentes de SQL antes de publicar
        run: node scripts/siga/check-release-contracts.mjs
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  deploy:
    name: Publicar na Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    # Qual o ambiente GitHub de onde saem os segredos. Por omissão `production`,
    # como sempre foi. A variável do repositório `DEPLOY_ENVIRONMENT` permite
    # apontar para outro sem mexer neste ficheiro — foi preciso a 30/10, quando o
    # `production` ficou sem um único segredo (a publicação falhou 4 vezes) e as
    # credenciais válidas estavam noutro ambiente. Apagar a variável em
    # Settings → Secrets and variables → Actions → Variables devolve o `production`.
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
      url: https://portal-siga.com
    timeout-minutes: 45
    steps:
      # Falha em segundos, com o nome do que falta, antes de instalar e construir.
      # Sem isto, a falta do token só aparecia a meio da publicação, dita pelo
      # wrangler (foi assim de #49 a #53: nada chegou à Cloudflare). Só nomes,
      # nunca valores. URL e chave publicável são públicas (as mesmas por omissão
      # de src/integrations/supabase/client.ts); a chave de serviço aceita a
      # SUPABASE_SECRET_KEY, que o servidor já prefere (client.server.ts).
      - name: Confirmar segredos obrigatórios do ambiente de publicação
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://xodgfmxiaunpamctfeea.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_NSqtGz5zxP_EngLuNj00Og_y3V4D4td' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta o segredo $name no ambiente GitHub '${{ vars.DEPLOY_ENVIRONMENT || 'production' }}' (Settings → Environments)."
              missing=1
            fi
          done
          exit $missing

      # O token pode existir e não servir (revogado, colado com espaços, Global API Key
      # em vez de API Token): a 29–30/10 o deploy falhou três vezes com «Invalid access
      # token» só dito pelo wrangler, a meio da publicação. Pergunta-se à Cloudflare logo
      # aqui e diz-se porquê. Mostra só o tipo, o comprimento e o estado; nunca o valor.
      - name: Confirmar o token da Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token="$CLOUDFLARE_API_TOKEN"
          where="Settings → Environments → ${{ vars.DEPLOY_ENVIRONMENT || 'production' }} → CLOUDFLARE_API_TOKEN"
          if [ "$token" != "$(printf '%s' "$token" | tr -d '[:space:]')" ]; then
            echo "::error::O token tem espaços ou quebras de linha. Volte a colá-lo em $where."
            exit 1
          fi
          case "$token" in
            cfut_*) kind="API Token de utilizador (cfut_)"; verify="user/tokens/verify" ;;
            cfat_*) kind="API Token de conta (cfat_)"; verify="accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" ;;
            cfk_*) echo "::error::Está guardada a Global API Key (cfk_), que o wrangler não usa. Crie um API Token e guarde-o em $where."; exit 1 ;;
            *) kind="API Token sem prefixo"; verify="user/tokens/verify" ;;
          esac
          echo "Token guardado: $kind, ${#token} caracteres."
          body="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/$verify" || true)"
          status="$(printf '%s' "$body" | jq -r '.result.status // empty' 2>/dev/null || true)"
          errors="$(printf '%s' "$body" | jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")' 2>/dev/null || true)"
          if [ "$status" != "active" ]; then
            echo "::error::A Cloudflare não aceita este token (estado: ${status:-desconhecido}; ${errors:-sem resposta}). Crie um token novo em Cloudflare → My Profile → API Tokens e guarde-o em $where."
            exit 1
          fi
          account="$(curl -sS --max-time 20 -H "Authorization: Bearer $token" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" | jq -r '.success' 2>/dev/null || true)"
          if [ "$account" != "true" ]; then
            echo "::error::O token está activo mas não tem acesso à conta CLOUDFLARE_ACCOUNT_ID. Em Account Resources do token, escolha a conta do SIGA."
            exit 1
          fi
          echo "Token activo e com acesso à conta."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências (SIGA e painéis)
        run: |
          bun install --frozen-lockfile
          npm ci --prefix painel/web
          npm ci --prefix painel/admin
          npm ci --prefix painel/docs
          npm ci --prefix painel/payflow

      - name: Publicar (DOC, WEB, ADMIN, PAYFLOW + D1, SIGA)
        run: node scripts/deploy-all.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://xodgfmxiaunpamctfeea.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_NSqtGz5zxP_EngLuNj00Og_y3V4D4td' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SIGA_CRON_SECRET: ${{ secrets.SIGA_CRON_SECRET }}
          OTP_PEPPER_SECRET: ${{ secrets.OTP_PEPPER_SECRET }}
          PAYFLOW_INTEGRATION_API_KEY: ${{ secrets.PAYFLOW_INTEGRATION_API_KEY }}
          PAYFLOW_SSO_SECRET: ${{ secrets.PAYFLOW_SSO_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          APPYPAY_WEBHOOK_TOKEN: ${{ secrets.APPYPAY_WEBHOOK_TOKEN }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          SIGA_ALERT_WEBHOOK_URL: ${{ secrets.SIGA_ALERT_WEBHOOK_URL }}
          HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
          APPYPAY_CLIENT_SECRET: ${{ secrets.APPYPAY_CLIENT_SECRET }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          SIGA_GATEWAY_ALERT_SLACK_URL: ${{ secrets.SIGA_GATEWAY_ALERT_SLACK_URL }}
          # Configuração não secreta (scripts/worker-secrets.mjs → OPTIONAL_WORKER_VARS);
          # vazias não são enviadas e o que está no painel da Cloudflare mantém-se.
          PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
          APPYPAY_ENV: ${{ vars.APPYPAY_ENV }}
          APPYPAY_CLIENT_ID: ${{ vars.APPYPAY_CLIENT_ID }}
          APPYPAY_RESOURCE: ${{ vars.APPYPAY_RESOURCE }}
          APPYPAY_GPO_METHOD: ${{ vars.APPYPAY_GPO_METHOD }}
          APPYPAY_REF_METHOD: ${{ vars.APPYPAY_REF_METHOD }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          GOOGLE_WORKSPACE_DOMAIN: ${{ vars.GOOGLE_WORKSPACE_DOMAIN }}
          MAILBOX_PROVIDER: ${{ vars.MAILBOX_PROVIDER }}
          PAYFLOW_AUTO_SYNC: ${{ vars.PAYFLOW_AUTO_SYNC }}
          SMS_API_URL: ${{ vars.SMS_API_URL }}
          WHATSAPP_OTP_TEMPLATE_NAME: ${{ vars.WHATSAPP_OTP_TEMPLATE_NAME }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          ZOHO_MAIL_CLIENT_ID: ${{ vars.ZOHO_MAIL_CLIENT_ID }}
          ZOHO_MAIL_ORG_ID: ${{ vars.ZOHO_MAIL_ORG_ID }}
          ZOOM_CLIENT_ID: ${{ vars.ZOOM_CLIENT_ID }}
          ZOOM_REDIRECT_URI: ${{ vars.ZOOM_REDIRECT_URI }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_WEBHOOK_AUTH_TOKEN: ${{ secrets.TWILIO_WEBHOOK_AUTH_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_CLOUD_TOKEN: ${{ secrets.WHATSAPP_CLOUD_TOKEN }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          ZOHO_MAIL_CLIENT_SECRET: ${{ secrets.ZOHO_MAIL_CLIENT_SECRET }}
          ZOHO_MAIL_REFRESH_TOKEN: ${{ secrets.ZOHO_MAIL_REFRESH_TOKEN }}
          PAYFLOW_R2_BUCKET: ${{ vars.PAYFLOW_R2_BUCKET }}
          # Chave pública do hCaptcha (vai no bundle). Sem ela, o SIGA publicado não
          # mostra o widget e o Supabase Auth (captcha activo) recusa todos os logins
          # por senha; o WEB também a usa no registo de escolas.
          VITE_HCAPTCHA_SITE_KEY: ${{ vars.VITE_HCAPTCHA_SITE_KEY }}

      - name: Confirmar DNS da plataforma (raiz, app e wildcard)
        run: npm run siga:check-dns

      # O health do PayFlow responde 503 quando a base D1 não responde; foi a
      # falta desta verificação que deixou o PayFlow semanas sem base.
      - name: Confirmar que os serviços publicados respondem
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 https://payflow.portal-siga.com/api/v1/health \
              && curl -fsS --max-time 15 -o /dev/null https://portal-siga.com/; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::PayFlow ou SIGA não respondem depois da publicação."
          exit 1
