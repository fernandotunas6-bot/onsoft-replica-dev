<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem ligação — SIGA</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #f7f7fb;
        --card: #ffffff;
        --fg: #1c1b23;
        --muted: #6b6a78;
        --primary: #6a2ce0;
        --primary-soft: #f0e9ff;
        --border: #e9e7f2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131219;
          --card: #1b1a23;
          --fg: #f3f2f7;
          --muted: #a09eae;
          --primary: #a884ff;
          --primary-soft: #2a2140;
          --border: #2a2833;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 12px 32px -18px rgba(20, 18, 40, 0.35);
      }
      .chip {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: var(--primary-soft);
        color: var(--primary);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        border: 0;
        cursor: pointer;
        padding: 11px 20px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .hint {
        margin-top: 16px;
        font-size: 0.75rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="chip" aria-hidden="true">
        <svg
          width="26"
          height="26"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M2 2l20 20" />
          <path d="M8.5 16.5a5 5 0 017 0" />
          <path d="M5 12.9a10 10 0 015.2-2.8" />
          <path d="M13.8 10.1A10 10 0 0119 12.9" />
          <path d="M2 8.8A15 15 0 016 6.3" />
          <path d="M10.7 5.1A15 15 0 0122 8.8" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>Sem ligação à internet</h1>
      <p>
        O SIGA continua disponível: as páginas e recursos já visitados abrem a partir do cache.
        Assim que a ligação voltar, tudo é actualizado automaticamente.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <p class="hint">Esta página faz parte do modo offline do SIGA.</p>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
