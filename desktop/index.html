<!doctype html>
<html lang="pt-AO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SIGA Desktop</title>
    <link rel="stylesheet" href="launcher.css" />
    <script src="launcher.js" defer></script>
  </head>
  <body>
    <main>
      <p class="brand">OnSoft · SIGA Desktop</p>
      <h1>A sua escola, num só lugar.</h1>
      <p>Entre no portal seguro para continuar o trabalho académico.</p>
      <p id="status" role="status" aria-live="polite">Pronto para ligar ao SIGA.</p>
      <button id="connect" type="button">Abrir SIGA</button>
      <p class="note">
        O portal exige ligação à Internet. Este ecrã permanece disponível offline; não guarda nem
        sincroniza operações académicas.
      </p>
    </main>
  </body>
</html>
