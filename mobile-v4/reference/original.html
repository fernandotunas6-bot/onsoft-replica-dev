min(88%,440px);height:70px;border-radius:44px;background:#ffffffb8;backdrop-filter:blur(20px);border:1px solid #d7d7d7;box-shadow:0 12px 28px #0002;display:flex;align-items:center;padding:6px;z-index:4}.nav button{flex:1;height:56px;border:0;border-radius:38px;background:transparent;font-size:26px}.nav button.active{background:#0000000c}.overlay{position:fixed;inset:0;background:#0005;z-index:5;display:flex;align-items:flex-end}.sheet{width:100%;max-height:82dvh;overflow:auto;background:white;border-radius:38px 38px 0 0;padding:16px 22px 35px;animation:rise .22s ease-out}.handle{width:74px;height:6px;border-radius:8px;background:#e9e9e9;margin:0 auto 25px}.sheethead{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:25px;font-size:22px;font-weight:650}.back{position:absolute;left:0;top:-8px}.menurow{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:transparent;border:0;padding:18px 8px;font-size:17px;border-radius:12px}.menurow:active{background:#f3f3f3}.ui-icon{display:inline-block;vertical-align:middle;flex-shrink:0}.symbol{display:inline-flex;align-items:center;justify-content:center;width:25px;color:#444;text-align:center;font-size:22px}.line{height:1px;background:#e6e6e6;margin:8px 0}.choice{border:1px solid #ddd;border-radius:16px;background:white;padding:20px 8px;flex:1;min-height:100px}.choice.selected{border-color:#111}.choices{display:flex;gap:12px}.swatches{display:flex;gap:12px;margin-top:15px}.swatch{height:65px;flex:1;border:2px solid transparent;border-radius:12px;background:linear-gradient(170deg,#fff 20%,#86aaff 55%,#ff40a1 85%)}.swatch:nth-child(2){background:linear-gradient(170deg,#fff 30%,#a7c9ff 62%,#ffc078)}.swatch:nth-child(3){background:linear-gradient(140deg,#c4ddff,#ffc0c9,#fff2d7)}.swatch.selected{border-color:#111}.search{border:1px solid #ddd;border-radius:13px;padding:13px 16px;width:100%;background:#ffffff90;margin-bottom:16px}.card{background:#fff;border:1px solid #e2e2e /* SIGA ambient motion: atmospheric background, never on controls. */
#app{isolation:isolate;background:#fafafa}
#app::before,#app::after{content:"";position:absolute;inset:-18%;z-index:-1;pointer-events:none;will-change:transform,opacity;transform:translate3d(0,0,0)}
#app.gradient{background:linear-gradient(180deg,#fafafa 0%,#f8f8fb 38%,#e9e9ff 100%)}
#app.gradient::before{background:radial-gradient(ellipse 48% 35% at 15% 88%,rgba(255,54,143,.94),transparent 78%),radial-gradient(ellipse 46% 36% at 78% 82%,rgba(118,108,255,.82),transparent 78%);filter:blur(32px);animation:siga-ambient-one 24s ease-in-out infinite alternate}
#app.gradient::after{background:radial-gradient(ellipse 45% 33% at 35% 76%,rgba(62,133,255,.84),transparent 79%),radial-gradient(ellipse 35% 30% at 92% 98%,rgba(255,105,198,.72),transparent 78%);filter:blur(44px);animation:siga-ambient-two 31s ease-in-out infinite alternate;opacity:.88}
#app.bg-one{background:linear-gradient(180deg,#fff 0%,#f9fbff 43%,#eaf3ff 100%)}
#app.bg-one::before{background:radial-gradient(ellipse at 48% 95%,#ffbb89,transparent 52%),radial-gradient(ellipse at 35% 82%,#91b8ff,transparent 58%);filter:blur(44px);animation:siga-ambient-one 27s ease-in-out infinite alternate}
#app.bg-two{background:linear-gradient(180deg,#fff 0%,#faf6ff 100%)}
#app.bg-two::before{background:radial-gradient(ellipse at 83% 87%,#ffc3b0,transparent 55%),radial-gradient(ellipse at 20% 73%,#bacbff,transparent 55%);filter:blur(44px);animation:siga-ambient-two 28s ease-in-out infinite alternate}
#app.dark{background:#151515!important}
#app.dark::before,#app.dark::after{opacity:.17}
#app>.top,#app>.content{position:relative;z-index:1}
@keyframes siga-ambient-one{0%{transform:translate3d(-3%,3%,0) scale(1.02)}50%{transform:translate3d(3%,-2%,0) scale(1.09)}100%{transform:translate3d(-1%,-5%,0) scale(1.04)}}
@keyframes siga-ambient-two{0%{transform:translate3d(3%,-3%,0) scale(1)}50%{transform:translate3d(-4%,3%,0) scale(1.08)}100%{transform:translate3d(4%,1%,0) scale(1.02)}}
@media(prefers-reduced-motion:reduce){#app::before,#app::after{animation:none!important;will-change:auto!important}.sheet{animation:none!important}}
@media(max-width:480px){#app.gradient::before,#app.gradient::after,#app.bg-one::before,#app.bg-two::before{filter:blur(28px)}}

/* SIGA visual refinement v3 — restrained, composited motion */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--line:rgba(24,24,27,.11);--focus:#6055dc}
button{transition:background-color .18s ease,border-color .18s ease,box-shadow .22s ease,transform .22s var(--ease-out);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{transform:scale(.965)}button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.round,.dots,.profile{display:inline-grid;place-items:center}.ui-icon{transition:transform .25s var(--ease-out);pointer-events:none}
button:hover>.ui-icon,button:hover>.symbol>.ui-icon{transform:translateY(-1px)}
.nav{box-shadow:0 12px 36px rgba(36,24,66,.13),0 1px 1px rgba(255,255,255,.8) inset;isolation:isolate}
.nav button.active{background:rgba(24,24,27,.085)}.nav button.active .ui-icon{stroke-width:2.2}
.workspace{max-width:calc(100vw - 112px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project,.chat{animation:content-enter .38s var(--ease-out) both;min-height:78px}
.sheet{animation:sheet-enter .42s var(--ease-out);overscroll-behavior:contain;box-shadow:0 -15px 60px #16102018}
.overlay{animation:veil-enter .22s ease both;backdrop-filter:blur(4px)}
.menurow{min-height:56px}.menurow:hover{background:rgba(120,120,140,.07)}
.composer{animation:content-enter .52s var(--ease-out) both}
@keyframes sheet-enter{from{transform:translate3d(0,38px,0);opacity:.75}to{transform:translate3d(0,0,0);opacity:1}}
@keyframes content-enter{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes veil-enter{from{opacity:0}to{opacity:1}}
@media(max-width:380px){.top{padding:20px 14px}.content{padding-left:16px;padding-right:16px}h1{font-size:31px}.nav{width:94%}.workspace{font-size:13px}}

const state={role:'professor',dailyTitle:'',tab:'home',sheet:'',menu:'',theme:'Sistema',bg:0,workspace:'Por seleccionar',schools:[],selectedSchoolId:null,projects:[],chats:[],filter:'',fav:[]};const ICON_PATHS={"house":"<path d=\"m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z\"/>","grid-2x2":"<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"2\"/>","messages-square":"<path d=\"M21 11.5a8.4 8.4 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3H14a8 8 0 0 1 7 8.5Z\"/><path d=\"M8 10h9M8 14h6\"/>","search":"<circle cx=\"11\" cy=\"11\" r=\"7\"/><path d=\"m20 20-4-4\"/>","list-filter":"<path d=\"M4 7h16M7 12h10M10 17h4\"/>","ellipsis":"<circle cx=\"5\" cy=\"12\" r=\"1\"/><circle cx=\"12\" cy=\"12\" r=\"1\"/><circle cx=\"19\" cy=\"12\" r=\"1\"/>","chevron-down":"<path d=\"m6 9 6 6 6-6\"/>","chevron-left":"<path d=\"m15 18-6-6 6-6\"/>","chevron-right":"<path d=\"m9 18 6-6-6-6\"/>","plus":"<path d=\"M12 5v14M5 12h14\"/>","arrow-up":"<path d=\"m5 12 7-7 7 7M12 5v14\"/>","user-round":"<circle cx=\"12\" cy=\"8\" r=\"4\"/><path d=\"M4 21a8 8 0 0 1 16 0\"/>","settings":"<path d=\"M12 3 14 5l3-.2.6 3 2.6 1.5-1 2.7 1 2.7-2.6 1.5-.6 3-3-.2-2 2-2-2-3 .2-.6-3L3.8 15l1-3-1-2.7L6.4 8l.6-3 3 .2z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>","bell":"<path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4\"/>","inbox":"<rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"3\"/><path d=\"M3 13h5l2 3h4l2-3h5\"/>","book-open":"<path d=\"M12 7c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V6c-3-1-6-1-9 1ZM12 7v14\"/>","sun":"<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/>","moon":"<path d=\"M20 15.5A8 8 0 0 1 8.5 4 8 8 0 1 0 20 15.5Z\"/>","monitor-smartphone":"<rect x=\"3\" y=\"4\" width=\"14\" height=\"12\" rx=\"2\"/><path d=\"M7 20h6M10 16v4\"/><rect x=\"17\" y=\"10\" width=\"5\" height=\"10\" rx=\"1\"/>","star":"<path d=\"m12 2 3.1 6.3 7 .9-5.1 5 .9 7-5.9-3.2-5.9 3.2.9-7-5.1-5 7-.9z\"/>","trash-2":"<path d=\"M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7\"/>","pencil":"<path d=\"m4 20 4.5-1 11-11-3.5-3.5-11 11L4 20ZM14 6l4 4\"/>","copy":"<rect x=\"8\" y=\"8\" width=\"12\" height=\"13\" rx=\"2\"/><path d=\"M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3\"/>","external-link":"<path d=\"M13 4h7v7M20 4l-9 9\"/><path d=\"M20 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5\"/>","eye":"<path d=\"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>","link":"<path d=\"M10 13a5 5 0 0 0 7 .5l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7-.5l-3 3a5 5 0 0 0 7 7l2-2\"/>","school":"<path d=\"M3 21V9l9-6 9 6v12M3 21h18M8 21v-7h8v7M7 10h.01M12 10h.01M17 10h.01\"/>","circle-help":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9 9a3 3 0 0 1 6 0c0 2-3 2-3 5M12 18h.01\"/>","users":"<circle cx=\"9\" cy=\"8\" r=\"3\"/><path d=\"M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 5v1\"/>","gift":"<rect x=\"3\" y=\"10\" width=\"18\" height=\"11\" rx=\"2\"/><path d=\"M12 10v11M3 14h18M12 10C3 10 5 3 9 4c2 0 3 6 3 6Zm0 0c9 0 7-7 3-6-2 0-3 6-3 6Z\"/>","plug":"<path d=\"M8 3v6m8-6v6M6 9h12v3a6 6 0 0 1-12 0V9ZM12 18v3\"/>","sliders-horizontal":"<path d=\"M4 7h8m4 0h4M4 17h4m4 0h8\"/><circle cx=\"14\" cy=\"7\" r=\"2\"/><circle cx=\"10\" cy=\"17\" r=\"2\"/>","check":"<path d=\"m4 12 5 5L20 6\"/>","panel-top":"<rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><path d=\"M3 9h18\"/>","refresh-cw":"<path d=\"M20 7v5h-5M4 17v-5h5\"/><path d=\"M5 9a8 8 0 0 1 14-2l1 5M4 12l1 5a8 8 0 0 0 14-2\"/>"};function ico(name,size=22){return `<svg class="ui-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]||ICON_PATHS['circle-help']}</svg>`}const icons={home:'house',projects:'grid-2x2',chats:'messages-square',daily:'book-open'};const app=document.getElementById('app');function openSheet(s){state.sheet=s;render()}function closeSheet(){state.sheet='';state.menu='';render()}function tab(t){state.tab=t;state.menu='';render()}function item(label,icon,action){const mapping={'Caixa de entrada':'inbox','Novidades':'bell','Perfil':'user-round','Configurações da conta':'settings','Conectores':'plug','Suporte':'circle-help','Documentação':'book-open','Aparência':'moon','Comunidade':'users','Por seleccionar':'school','Configurações do espaço escolar':'settings','Solicitar acesso a uma escola':'plus','Abrir em nova aba':'external-link','Conversar sobre este projecto':'messages-square','Adicionar aos favoritos':'star','Remixar':'refresh-cw','Copiar':'copy','Abrir':'eye','Mover':'refresh-cw','Editar':'pencil','Configurações':'settings','Publicar no perfil':'external-link','Excluir':'trash-2','Marcar chat com estrela':'star','Renomear':'pencil','Alterar ícone':'smile','Marcar como lido':'eye','Copiar link':'link','Planos e uso de créditos':'panel-top','Limites de uso e alertas':'bell','Pessoas':'user-round','Grupos':'users','Identidade':'user-round','Conhecimento':'book-open','Habilidades':'star','Modelos':'grid-2x2','Aplicar pesquisa':'search','Todos':'list-filter','Favoritos':'star','Carregar ficheiro':'plus','Ligar conector':'plug'};icon=mapping[label]||(label.startsWith('Escola')?'school':icon==='✓'?'check':'school');return `<button class="menurow" onclick="${action}"><span class="symbol">${ico(icon,22)}</span><span>${label}</span></button>`}function render(){app.className=(state.bg===0?'gradient ':state.bg===1?'bg-one ':'bg-two ')+(state.theme==='Escuro'?'dark':'');let html=`<header class="top"><button class="workspace" onclick="openSheet('workspace')"><span class="avatar">S</span>${state.workspace} <span style="color:#777">${ico("chevron-down",18)}</s
